name: Rust

on:
  push:
    branches: [ "master" ]
    tags:
      - "v*.*.*"
  pull_request:
    branches: [ "master" ]
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: tor-browser-builder

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y pkg-config nettle-dev
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose

  build-linux:
    name: Build (Linux)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system deps (egui/eframe needs these on Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev pkg-config

      - name: Build
        run: cargo build --release --locked

      - name: Package
        run: |
          mkdir -p dist
          cp target/release/${{ env.BIN_NAME }} dist/
          tar -C dist -czf ${{ env.BIN_NAME }}-linux-x86_64.tar.gz ${{ env.BIN_NAME }}

      - uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: ${{ env.BIN_NAME }}-linux-x86_64.tar.gz

  build-windows:
    name: Build (Windows)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release --locked

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target/release/${{ env.BIN_NAME }}.exe dist/
          Compress-Archive -Path dist/${{ env.BIN_NAME }}.exe `
            -DestinationPath ${{ env.BIN_NAME }}-windows-x86_64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: ${{ env.BIN_NAME }}-windows-x86_64.zip

  build-macos:
    name: Build (macOS)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    strategy:
      matrix:
        target: [x86_64-apple-darwin, aarch64-apple-darwin]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Assemble .app bundle
        run: |
          APP_DIR="dist/${{ env.BIN_NAME }}.app"
          mkdir -p "$APP_DIR/Contents/MacOS"
          mkdir -p "$APP_DIR/Contents/Resources"

          cp target/${{ matrix.target }}/release/${{ env.BIN_NAME }} \
            "$APP_DIR/Contents/MacOS/${{ env.BIN_NAME }}"
          chmod +x "$APP_DIR/Contents/MacOS/${{ env.BIN_NAME }}"

          cat > "$APP_DIR/Contents/Info.plist" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>
            <string>${{ env.BIN_NAME }}</string>
            <key>CFBundleDisplayName</key>
            <string>${{ env.BIN_NAME }}</string>
            <key>CFBundleIdentifier</key>
            <string>com.example.${{ env.BIN_NAME }}</string>
            <key>CFBundleVersion</key>
            <string>${{ github.ref_name }}</string>
            <key>CFBundleShortVersionString</key>
            <string>${{ github.ref_name }}</string>
            <key>CFBundleExecutable</key>
            <string>${{ env.BIN_NAME }}</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>LSMinimumSystemVersion</key>
            <string>10.13</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          EOF

          # --- Optional: code signing / notarization would go here ---
          # codesign --deep --force --options runtime \
          #   --sign "Developer ID Application: Your Name (TEAMID)" "$APP_DIR"
          # xcrun notarytool submit ... && xcrun stapler staple "$APP_DIR"

      - name: Zip .app
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent \
            "${{ env.BIN_NAME }}.app" \
            "../${{ env.BIN_NAME }}-macos-${{ matrix.target }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-build-${{ matrix.target }}
          path: ${{ env.BIN_NAME }}-macos-${{ matrix.target }}.zip

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifact files
        run: |
          mkdir -p out
          find artifacts -type f \( -name "*.zip" -o -name "*.tar.gz" \) -exec cp {} out/ \;
          ls -la out

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          draft: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
